# First-pass Slack app manifest (docs/SLACK-BOT-AWS-SETUP.md, step B2).
#
# api.slack.com/apps → Create New App → From a manifest → your workspace → paste this (YAML tab).
#
# It sets the bot user, the three bot scopes and the Messages tab, and deliberately has no event
# subscriptions or interactivity: those need a request URL, which Slack verifies on save and which
# only exists after step B9. Step B10 adds them (by hand, or by pasting slack-app-manifest.yaml).
display_information:
    name: Saturam Onboarding
    description: Answers questions about our projects from the onboarding knowledge base.
    background_color: "#1d3557"
features:
    app_home:
        home_tab_enabled: false
        messages_tab_enabled: true
        messages_tab_read_only_enabled: false
    bot_user:
        display_name: onboarding
        always_online: true
oauth_config:
    scopes:
        bot:
            - app_mentions:read # @mentions in channels
            - chat:write # post, update, and ephemeral replies
            - im:history # read direct messages sent to the bot
settings:
    org_deploy_enabled: false
    socket_mode_enabled: false
    token_rotation_enabled: false
