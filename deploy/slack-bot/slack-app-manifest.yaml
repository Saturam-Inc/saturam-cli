# Slack app manifest for the onboarding bot — the finished configuration, for reference and for
# re-applying in one paste (api.slack.com/apps → your app → App Manifest).
#
# The setup guide (docs/SLACK-BOT-AWS-SETUP.md, steps B2 and B10) configures the app by hand in two passes, because
# Slack verifies the request URL the moment it is saved, and that URL only exists once the AWS
# side is deployed. Replace <API_GATEWAY_URL> with the invoke URL from step B9 before pasting.
#
# For local development with `pnpm slack:dev`, create a separate app from this manifest with
# socket_mode_enabled: true; the request_url lines are then ignored and can be removed.
#
# To create the app before the AWS side exists, start from slack-app-manifest.initial.yaml (B2).
display_information:
    name: Saturam Onboarding
    description: Answers questions about our projects from the onboarding knowledge base.
    background_color: "#1d3557"
features:
    app_home:
        home_tab_enabled: false
        messages_tab_enabled: true
        messages_tab_read_only_enabled: false
    bot_user:
        display_name: onboarding
        always_online: true
oauth_config:
    scopes:
        bot:
            - app_mentions:read # @mentions in channels
            - chat:write # post, update, and ephemeral replies
            - im:history # read direct messages sent to the bot
settings:
    event_subscriptions:
        request_url: <API_GATEWAY_URL>/slack/events
        bot_events:
            - app_mention
            - message.im
    interactivity:
        is_enabled: true
        request_url: <API_GATEWAY_URL>/slack/events
    org_deploy_enabled: false
    socket_mode_enabled: false
    token_rotation_enabled: false
